<html lang="ko">
<head>

<title>관리자 | 제주 에코투어리즘</title>
<style>
:root{--bg:#F7F2E8;--card:#fff;--ink:#2A2320;--soft:#5E5248;--line:#E6DAC4;--forest:#2F5E3A;--deep:#1E3F27;--red:#A83A20}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
header{background:var(--deep);color:#fff;padding:12px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
header b{font-size:1.05rem}
nav{display:flex;flex-wrap:wrap;gap:6px;padding:12px 20px 0;max-width:1100px;margin:0 auto}
nav button{border:1px solid var(--line);background:#fff;border-radius:10px 10px 0 0;padding:9px 14px;font:inherit;cursor:pointer}
nav button[aria-selected=true]{background:var(--forest);border-color:var(--forest);color:#fff;font-weight:700}
main{max-width:1100px;margin:0 auto;padding:0 20px 60px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:0 12px 12px 12px;padding:20px;overflow-x:auto}
h2{margin:0 0 10px;font-size:1.2rem}
h3{margin:22px 0 8px;font-size:1.02rem}
table{border-collapse:collapse;width:100%;font-size:.93rem}
th,td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:middle}
th{background:#F2EAD9;white-space:nowrap}
.btn{min-height:38px;padding:6px 12px;border:1px solid var(--forest);border-radius:9px;background:#fff;color:var(--forest);font:inherit;font-size:.9rem;font-weight:700;cursor:pointer;margin:2px}
.btn.on{background:var(--forest);color:#fff}
.btn.warn{border-color:var(--red);color:var(--red)}
.btn:disabled{opacity:.5;cursor:wait}
.chip{display:inline-block;padding:2px 9px;border-radius:99px;font-size:.82rem;font-weight:700;background:#E7F1E4;color:#23552F;white-space:nowrap}
.chip.private{background:#EEE;color:#555}.chip.password{background:#FFF2C9;color:#7A5A00}.chip.checking{background:#F2EAD9;color:#776}
input[type=password],input[type=text],textarea{width:100%;max-width:420px;font:inherit;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:#fff}
label{display:block;font-weight:700;margin-top:12px}
.note{color:var(--soft);font-size:.9rem}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:10px;max-width:92vw;display:none;z-index:9}
#login{max-width:400px;margin:60px auto;background:#fff;border:1px solid var(--line);border-radius:14px;padding:26px}
dialog{border:1px solid var(--line);border-radius:14px;padding:22px;max-width:440px;width:92vw}
dialog::backdrop{background:rgba(0,0,0,.4)}
.stats{display:flex;flex-wrap:wrap;gap:10px;margin:10px 0}
.stat{border:1px solid var(--line);border-radius:10px;padding:8px 14px;background:#FBF8F1}
.stat b{display:block;font-size:1.2rem}
.md{max-width:900px}.md h1{font-size:1.25rem}.md h2{font-size:1.15rem;margin-top:22px}.md h3{font-size:1.02rem}.md h4{font-size:.96rem;margin:16px 0 6px}
.md p,.md li{font-size:.94rem}.md ul,.md ol{padding-left:22px;margin:6px 0}.md code{background:#F2EAD9;border-radius:4px;padding:0 4px;font-size:.88em}
.md table{margin:8px 0}.md td,.md th{vertical-align:top;font-size:.88rem}.md hr{border:0;border-top:1px solid var(--line);margin:16px 0}
.day{border:1px solid var(--line);border-radius:12px;padding:4px 16px 10px;margin:12px 0;background:#FFFDF8}.day>h3{margin-top:12px;color:var(--deep)}
mark{background:#FFE58A;padding:0 1px}
.who{display:inline-block;margin-left:4px;padding:0 7px;border-radius:99px;font-size:.78rem;font-weight:700;background:#EEE;color:#444;white-space:nowrap}.who.me{background:#1E3F27;color:#fff}li.mine{background:#F1F7EF;border-radius:6px;padding:1px 4px}
.tm{display:inline-block;font-weight:700;color:#0f5c6e;background:#E3F0F3;border-radius:6px;padding:0 6px;font-size:.92em;white-space:nowrap}.chip.mt{background:#E8E1F5;color:#4B2E83}
</style>
</head>
<body>
<header><b>제주 에코투어리즘 관리자</b><span id="who" hidden><a href="/" target="_blank" style="color:#fff;margin-right:12px">사이트 열기</a><button class="btn" id="logout" style="background:#fff">로그아웃</button></span></header>

<script>
(function(){

var PAGES=[['index.html','홈'],['about.html','센터 소개'],['ecotourism.html','생태관광이란'],['work/index.html','하는 일'],['schedule.html','행사 일정'],['projects.html','진행 사업'],['records.html','기록'],['contact.html','문의'],
['events/2026-birding/index.html','탐조대회 안내'],['events/2026-birding/birds/index.html','탐조대회 새 정보'],['events/2026-birding/birds/changes/index.html','미니도감과 달라진 내용'],['events/2026-birding/survey/index.html','탐조대회 만족도 조사'],['events/2026-birding/record/index.html','탐조대회 기록'],['events/2026-11-advisory-meeting/record/index.html','자문단 회의 기록'],['events/2026-11-gangwon-visit/record/index.html','강원 협의회 방문 기록'],['events/2026-11-marine-exhibition/record/index.html','해양생물 전시 기록'],['events/2026-11-stonepark/record/index.html','제주국제생태포럼 발표 기록'],
['events/2026-autumn/index.html','2026 가을 생태관광주간'],['program.html','가을 생태관광주간 프로그램 상세 (27개 공통 페이지)'],['events/2026-summer/index.html','2026 여름 갯것이영화제'],['projects/ozori-book-plan/index.html','오조리 기획안'],['projects/ozori-review/index.html','오조리 채록 검수'],['projects/ozori-review/audio-check/index.html','오조리 원음 확인'],['projects/garosugil-map/index.html','가로수길 지도 시안'],['projects/gotjawal-oreum-report/index.html','곶자왈·오름 평가 보고'],['projects/gotjawal-oreum-report/responses/index.html','곶자왈·오름 평가지 개별 응답'],['projects/susan2-bat-character/index.html','수산2리 캐릭터 기획안'],['projects/jeonbuk-exchange-2026/index.html','전북 생태관광 교류방문'],['projects/joint-workshop-2026/index.html','2026 생태관광 합동워크숍'],['projects/marine-monitoring/index.html','해양생물 모니터링']];
var TABS=[['pages','페이지 공개·비밀번호'],['cards','카드 공개'],['survey','만족도 조사'],['contact','문의'],['report','새 정보 의견'],['log','일지'],['settings','설정']];
var $=function(s){return document.querySelector(s)};
var S=null; try{S=sessionStorage.getItem('adm')}catch(e){}
var status={};
var OWNS={'협회':['#e3efe4','#1e3f27'],'센터':['#dcecf0','#0f5c6e'],'외주':['#f6e3dc','#8a3a1c'],'미정':['#fbeed5','#7a4a00']};
function own(c){var o=(c&&c.owner)||'미정',list=Array.isArray(o)?o:[o];return list.map(function(x){var k=OWNS[x]||['#eee','#444'];return '<span style="display:inline-block;padding:2px 8px;margin:1px 2px 1px 0;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap;background:'+k[0]+';color:'+k[1]+'">'+esc(x)+'</span>'}).join('')}
function ownNote(c){return c&&c.ownerNote?'<br><span class="note">'+esc(c.ownerNote)+'</span>':''}
function loadCards(){return Promise.all(['events','projects'].map(function(n){return fetch('/data/'+n+'.js?t='+Date.now(),{cache:'no-store'}).then(function(r){return r.text()})})).then(function(a){return {ev:new Function(a[0]+';return EVENTS')(),pr:new Function(a[1]+';return PROJECTS')()}})}
function pageCard(path,d){var m=path.match(/^events\/([^/]+)\//);if(m)return d.ev.filter(function(e){return e.id===m[1]})[0];var dir=path.replace(/index\.html$/,'');return d.pr.filter(function(p){return p.url&&dir.indexOf(p.url)===0||(p.links||[]).some(function(l){return dir.indexOf(l.url)===0})})[0]}
function attr(s){return esc(s).replace(/"/g,'&quot;')}
function esc(s){var d=document.createElement('div');d.textContent=s==null?'':s;return d.innerHTML}
function toast(m,ms){var t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(function(){t.style.display='none'},ms||5000)}
function api(o){o.session=S;return fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(o)}).then(function(r){return r.json()}).then(function(j){
  if(j.auth===false){out();throw new Error('다시 로그인해 주세요.')}
  if(!j.ok)throw new Error(j.error||'처리하지 못했습니다.');return j})}
function out(){S=null;try{sessionStorage.removeItem('adm')}catch(e){}$('#app').hidden=true;$('#who').hidden=true;$('#login').hidden=false}
function start(){$('#login').hidden=true;$('#app').hidden=false;$('#who').hidden=false;
  api({action:'status'}).then(function(j){status=j;var h=location.hash.slice(1).split('/');tab(h[0]||'pages',h[1])}).catch(function(e){toast(e.message)})}
$('#login').addEventListener('submit',function(e){e.preventDefault();$('#lg').disabled=true;$('#lm').textContent='';
  fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'login',pw:$('#lp').value})}).then(function(r){return r.json()}).then(function(j){
    if(!j.ok)throw new Error(j.error);S=j.session;try{sessionStorage.setItem('adm',S)}catch(e){}$('#lp').value='';start()}).catch(function(x){$('#lm').textContent=x.message||'로그인하지 못했습니다.'}).finally(function(){$('#lg').disabled=false})});
$('#logout').onclick=function(){api({action:'logout'}).catch(function(){}).finally(out)};
function tab(n,sub){if(!TABS.some(function(t){return t[0]===n}))n='pages';location.hash=n+(sub?'/'+sub:'');
  $('#tabs').innerHTML=TABS.map(function(t){return '<button role="tab" aria-selected="'+(t[0]===n)+'" data-t="'+t[0]+'">'+t[1]+'</button>'}).join('');
  $('#tabs').querySelectorAll('button').forEach(function(b){b.onclick=function(){tab(b.dataset.t)}});
  ({pages:vPages,cards:vCards,survey:function(){vSurveys(sub)},contact:function(){vList('contact','문의')},report:function(){vList('birding2026-bird-report','새 정보 수정 의견')},log:function(){vLog(sub)},settings:vSettings})[n]()}
/* 일지: 센터 업무일지. 내용은 공개 저장소가 아니라 관리자 서버(비공개 드라이브 파일)에 있고, 로그인 뒤에만 받아 옵니다.
   올리기는 tools/upload_center_log.py (일지정리 세션이 일지를 고칠 때마다 실행) */
/* 회의 표시와 시각(09:00~10:30)은 눈에 띄게 (사용자 지시 2026-11-19) */
function mdInline(t){return names(link(esc(t)).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>').replace(/\[회의([^\]]*)\]/g,'<span class="chip mt">회의$1</span>').replace(/(^|[^\d:])(\d{1,2}:\d{2}(?:\s*~\s*\d{1,2}:\d{2})?)(?![\d:])/g,'$1<span class="tm">$2</span>'))}
/* 끝에 붙은 (이름)·(이름·이름)을 이름 배지로. 전현석 배지는 진하게 */
var NOT_NAME=/^(오전|오후|예정|완료|취소|대기|확인|진행|보류|미정|변경|추가|일부|전체|초안|최종)$/;
function names(h){return h.replace(/\(([가-힣]{2,4}(?:\s?[·,]\s?[가-힣]{2,4})*)\)\s*$/,function(all,g){var ns=g.split(/\s?[·,]\s?/);if(ns.some(function(n){return NOT_NAME.test(n)}))return all;
  return ns.map(function(n){return '<span class="who'+(n==='전현석'?' me':'')+'">'+n+'</span>'}).join('')})}
function link(h){return h.replace(/(https?:\/\/[^\s<)\]]+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>')}
function mdHtml(src){var L=String(src).split('\n'),h=[],i=0,list=null;
  var close=function(){if(list){h.push('</'+list+'>');list=null}};
  while(i<L.length){var l=L[i],m;
    if(/^\s*\|/.test(l)){close();var rows=[];while(i<L.length&&/^\s*\|/.test(L[i])){rows.push(L[i]);i++}
      var cells=function(r){return r.trim().replace(/^\||\|$/g,'').split('|').map(function(c){return c.trim()})};
      var body=rows.filter(function(r,k){return !(k===1&&/^[\s|:-]+$/.test(r))});
      h.push('<table>'+body.map(function(r,k){var tg=k===0&&rows.length>1&&/^[\s|:-]+$/.test(rows[1])?'th':'td';return '<tr>'+cells(r).map(function(c){return '<'+tg+'>'+mdInline(c)+'</'+tg+'>'}).join('')+'</tr>'}).join('')+'</table>');continue}
    if((m=l.match(/^(#{1,4})\s+(.*)/))){close();var n=Math.min(m[1].length+1,4);h.push('<h'+n+'>'+mdInline(m[2])+'</h'+n+'>')}
    else if(/^---+\s*$/.test(l)){close();h.push('<hr>')}
    else if((m=l.match(/^\s*[-*]\s+(.*)/))){if(list!=='ul'){close();h.push('<ul>');list='ul'}var li=mdInline(m[1]);h.push('<li'+(li.indexOf('who me')>=0?' class="mine"':'')+'>'+li+'</li>')}
    else if((m=l.match(/^\s*\d+[.)]\s+(.*)/))){if(list!=='ol'){close();h.push('<ol>');list='ol'}h.push('<li>'+mdInline(m[1])+'</li>')}
    else if(/^\s*$/.test(l)){close()}
    else{close();h.push('<p>'+mdInline(l)+'</p>')}
    i++}
  close();return h.join('')}
/* 일지 md 를 나눕니다: ## 제목 단위 묶음, 그 안의 ### 날짜 항목 */
function logParse(md){var secs=[],cur={title:'',lines:[]};String(md).split('\n').forEach(function(l){if(/^## /.test(l)){secs.push(cur);cur={title:l.slice(3).trim(),lines:[]}}else cur.lines.push(l)});secs.push(cur);
  var days=[];secs.forEach(function(s){var ym=s.title.match(/^(\d{4})년\s*(\d{1,2})월/);if(!ym)return;var d=null;s.lines.forEach(function(l){if(/^### /.test(l)){d={month:ym[1]+'-'+('0'+ym[2]).slice(-2),label:s.title,title:l.slice(4).trim(),lines:[]};days.push(d)}else if(d)d.lines.push(l)})});
  return {secs:secs,days:days.reverse()}}
var LOG=null;
/* 일지는 관리자 로그인에 더해 일지 비밀번호가 필요합니다. 확인은 서버가 하고, 맞으면 그 로그인 동안 열려 있습니다. 비밀번호는 화면에 남기지 않습니다. */
function vLog(sub){$('#view').innerHTML='<h2>일지</h2><p class="note">센터 업무일지입니다. 관리자 로그인 뒤에도 일지 비밀번호를 한 번 더 넣어야 서버에서 받아 오며, 공개 저장소·사이트에는 들어 있지 않습니다. 일지정리 작업에서 일지를 고칠 때마다 이곳으로 올립니다.</p><div id="lg0">불러오는 중…</div>';
  logLoad(sub||'days')}
function logLoad(v,pw){var o={action:'logGet'};if(pw)o.logPw=pw;
  return api(o).then(function(j){LOG={at:j.at,md:j.md||'',p:logParse(j.md||'')};logDraw(v)}).catch(function(e){
    if(/일지 비밀번호/.test(e.message))return logAsk(v,pw?e.message:'');
    $('#lg0').innerHTML=/알 수 없는 요청/.test(e.message)?'<p class="note">관리자 서버(Apps Script)에 일지 기능을 넣은 뒤(버전 12)부터 보입니다.</p>':'<p class="note">불러오지 못했습니다: '+esc(e.message)+'</p>'})}
function logAsk(v,msg){$('#lg0').innerHTML='<form id="lpf" style="max-width:420px;margin-top:8px"><label for="lpw">일지 비밀번호</label><input id="lpw" type="password" autocomplete="off" required><p class="note" role="alert" style="color:var(--red);min-height:1.4em">'+esc(msg||'')+'</p><button class="btn on" id="lpb">일지 열기</button></form>';
  $('#lpw').focus();
  $('#lpf').onsubmit=function(e){e.preventDefault();var i=$('#lpw'),p=i.value;i.value='';$('#lpb').disabled=true;logLoad(v,p)}}
/* 업무량 요약: 일지 원문에서 센 숫자만 (사용자 지시 2026-11-19) */
var ME='전현석',OUTRX=/게시|배포|올림|올렸|공개|제작|완성|출력|편집|작성|발송|제출|인쇄/;
function kst(){return new Date(Date.now()+9*3600e3).toISOString().slice(0,10)}
function logStats(P){var today=kst(),t=new Date(today+'T00:00:00Z'),dow=(t.getUTCDay()+6)%7;
  var wk=new Date(t-dow*864e5).toISOString().slice(0,10),mo=today.slice(0,8)+'01';
  var per=[['이번 주',wk],['이번 달',mo],['11/01부터','2026-11-01']];
  var items=[];P.days.forEach(function(d){var m=d.title.match(/^(\d{1,2})\/(\d{1,2})/);if(!m)return;var date=d.month.slice(0,4)+'-'+('0'+m[1]).slice(-2)+'-'+('0'+m[2]).slice(-2);
    d.lines.forEach(function(l){var x=l.match(/^\s*(?:[-*]|\d+[.)])\s+(.*)/);if(!x)return;var g=x[1].match(/\(([가-힣]{2,4}(?:\s?[·,]\s?[가-힣]{2,4})*)\)\s*$/);if(g&&g[1].split(/\s?[·,]\s?/).indexOf(ME)>=0)items.push({date:date,text:x[1],out:OUTRX.test(x[1])||/https?:\/\//.test(x[1])})})});
  var hol={};P.secs.forEach(function(s){if(!/휴일 근무/.test(s.title))return;s.lines.forEach(function(l){var c=l.split('|').map(function(x){return x.trim()});var m=(c[1]||'').match(/^(\d{1,2})\/(\d{1,2})/);if(m&&/추가근무|휴일 근무/.test(c[2]||''))hol['2026-'+('0'+m[1]).slice(-2)+'-'+('0'+m[2]).slice(-2)]=1})});
  var hd=Object.keys(hol);

var SRV_OLD=false;
function pagePath(u){u=String(u||'').replace(/^\//,'').replace(/[?#].*$/,'');return /\.html?$/i.test(u)?u:u.replace(/\/?$/,'/')+'index.html'}
/* 주소에 ?id= 같은 뒷부분이 있으면(program.html?id=p21) 열 때만 붙이고, 공개 상태·비밀번호는 파일(program.html) 기준입니다 */
function baseOf(path){return String(path).split('?')[0]}
function urlOf(path,k){var q=String(path).split('?')[1];return '/'+baseOf(path).replace(/index\.html$/,'')+'?'+(q?q+'&':'')+k}
function stateNow(path){return fetch(urlOf(path,'t='+Date.now()),{cache:'no-store'}).then(function(r){return r.text()}).then(function(t){return {s:stateOf(t),t:t}})}
function oldSrv(e){if(/알 수 없는 요청/.test(e&&e.message||'')){SRV_OLD=true;return true}throw e}
function getPw(path){return api({action:'pagePw',path:path}).then(function(j){return j.pw||''},function(e){oldSrv(e);return ''})}
function savePw(path,pw){return api({action:'pagePwSave',path:path,pw:pw||''}).then(function(){return true},function(e){oldSrv(e);return false})}
function learnPw(path,t,title){return ask('비밀번호 확인',[['pw','"'+title+'" 비밀번호 — 관리자 서버에 저장된 값이 없습니다. 한 번 넣으면 맞는지 확인한 뒤 서버에 기록해 다음부터 바로 보입니다.']]).then(function(o){if(!o)return null;
  return decrypt(t,o.pw).then(function(h){return savePw(path,o.pw).then(function(ok){toast(ok?'비밀번호를 관리자 서버에 기록했습니다.':'서버(Apps Script) 업데이트 전이라 비밀번호를 기록하지 못했습니다. 이번만 열어 둡니다.',8000);return {pw:o.pw,html:h}})})})}
function openPage(full,title){var path=baseOf(full);var w=window.open(urlOf(full,'admin='+Date.now()),'_blank');if(!w)return toast('팝업이 막혔습니다. 이 사이트의 팝업을 허용해 주세요.',9000);
  var put=function(h){var k=0,t=setInterval(function(){k++;var ok=false;try{ok=w.document.readyState==='complete'&&w.location.pathname.length>1}catch(e){}if(ok||k>100){clearInterval(t);w.document.open();w.document.write(h);w.document.close()}},150)};
  stateNow(path).then(function(x){if(x.s==='public')return;
    if(x.s==='private')return api({action:'pageFile',path:path,orig:true}).then(function(f){put(dec(f.b64))});
    return getPw(path).then(function(pw){if(pw)return decrypt(x.t,pw).then(put).catch(function(){return learnPw(path,x.t,title).then(function(r){if(r)put(r.html)})});return learnPw(path,x.t,title).then(function(r){if(r)put(r.html);else w.close()})})
  }).catch(function(e){toast(e.message||'열지 못했습니다.',9000)})}
function pwBox(title,pw){var d=$('#dlg'),f=$('#dlgf');d.onclose=null;
  f.innerHTML='<h2>'+esc(title)+'</h2><label for="pwv">설정된 비밀번호</label><input id="pwv" type="password" readonly value="'+attr(pw)+'"><p style="margin-top:16px"><button type="button" class="btn" id="pwS">보기</button><button type="button" class="btn" id="pwC">복사</button><button class="btn on" value="ok">닫기</button></p>';
  $('#pwS').onclick=function(){var i=$('#pwv');i.type=i.type==='password'?'text':'password';this.textContent=i.type==='password'?'보기':'가리기'};
  $('#pwC').onclick=function(){var i=$('#pwv');(navigator.clipboard?navigator.clipboard.writeText(pw):Promise.reject()).then(function(){toast('복사했습니다.')},function(){i.type='text';i.select();document.execCommand('copy');toast('복사했습니다.')})};
  d.returnValue='';d.showModal()}
function showPw(full,title){var path=baseOf(full);stateNow(path).then(function(x){if(x.s!=='password')return toast('지금 비밀번호가 걸린 페이지가 아닙니다.');
  return getPw(path).then(function(pw){if(pw)return pwBox(title,pw);return learnPw(path,x.t,title).then(function(r){if(r)pwBox(title,r.pw)})})}).catch(function(e){toast(e.message||'비밀번호를 가져오지 못했습니다.',9000)})}
/* 연결 페이지 칸: 상태와 바로 열기·비밀번호 보기 */
var VIEWN=0;
function viewCell(list){return list.map(function(x){var id='vw'+(VIEWN++);return '<div style="margin:2px 0;white-space:nowrap"><span class="chip checking" id="'+id+'" data-vp="'+attr(x[0])+'" data-vt="'+attr(x[1])+'">확인 중</span> <button class="btn" data-open="'+attr(x[0])+'" data-title="'+attr(x[1])+'">'+esc(x[2]||'바로 열기')+'</button><button class="btn" data-pw="'+attr(x[0])+'" data-title="'+attr(x[1])+'" hidden>비밀번호 보기</button></div>'}).join('')||'<span class="note">-</span>'}
function wireView(box){box.querySelectorAll('[data-open]').forEach(function(b){b.onclick=function(){openPage(b.dataset.open,b.dataset.title)}});
  box.querySelectorAll('[data-pw]').forEach(function(b){b.onclick=function(){showPw(b.dataset.pw,b.dataset.title)}});
  box.querySelectorAll('[data-vp]').forEach(function(c){stateNow(c.dataset.vp).then(function(x){c.className='chip '+x.s;c.textContent=LBL[x.s];var pb=c.parentNode.querySelector('[data-pw]');if(pb)pb.hidden=x.s!=='password'}).catch(function(){c.textContent='열 수 없음'})})}
function internal(u){return u&&!/^[a-z]+:/i.test(u)&&!/\.(pdf|jpe?g|png|mp4|zip)$/i.test(u)}
function recPages(r){return [r.url].concat((r.links||[]).map(function(l){return l.url})).filter(function(u){return u&&!/^[a-z]+:/i.test(u)&&/(\/|\.html(\?.*)?)$/.test(u)&&u!=='records.html'})}
function pageKey(u){var q=String(u).split('?')[1];return pagePath(String(u).split('?')[0])+(q?'?'+q:'')}
function vCards(){$('#view').innerHTML='<h2>카드 공개</h2><p class="note">비공개한 카드는 일정·사업·기록 목록에서 빠집니다. 카드를 숨겨도 페이지 주소로는 열리므로, 페이지 자체의 공개·비밀번호는 "페이지 공개·비밀번호" 탭에서 정합니다. "연결 페이지"는 그 탭의 현재 상태를 보여 주고, 비공개·비밀번호 페이지도 관리자는 "바로 열기"로 비밀번호 없이 봅니다. 바꾼 내용은 1~2분 뒤(브라우저 기억 때문에 길게는 10분) 사이트에 반영됩니다.</p><div id="cl">불러오는 중…</div>';
  Promise.all(['events','projects'].map(function(n){return fetch('/data/'+n+'.js?t='+Date.now(),{cache:'no-store'}).then(function(r){return r.text()})})).then(function(a){
    var ev=new Function(a[0]+';return EVENTS')(),pr=new Function(a[1]+';return PROJECTS')(),rc=new Function(a[0]+';return typeof RECORDS==="undefined"?[]:RECORDS')();
    var row=function(file,k,t,sub,c,pages){return '<tr><td>'+esc(t)+'<br><span class="note">'+esc(sub)+'</span></td><td>'+own(c)+ownNote(c)+'</td><td><span class="chip '+(c.draft?'private':'')+'">'+(c.draft?'비공개':'공개')+'</span></td><td><button class="btn" data-f="'+file+'" data-k="'+attr(k)+'" data-field="draft" data-on="'+(c.draft?'':'1')+'">'+(c.draft?'공개로':'비공개로')+'</button>'+(file==='data/projects.js'||/^rec:/.test(k)?'<button class="btn" data-f="'+file+'" data-k="'+attr(k)+'" data-field="locked" data-on="'+(c.locked?'':'1')+'">'+(c.locked?'비밀번호 표시 끄기':'비밀번호 표시 켜기')+'</button>':'')+'</td><td>'+viewCell(pages)+'</td></tr>'};
    var head='<table><thead><tr><th>카드</th><th>주최</th><th>상태</th><th>바꾸기</th><th>연결 페이지 (관리자 바로 보기)</th></tr></thead><tbody>';
    var evPages=function(e){var l=[];if(internal(e.url))l.push([pagePath(e.url),e.title+' 안내','안내 열기']);if(internal(e.record)&&e.record!=='records.html')l.push([pagePath(e.record),e.title+' 기록','기록 열기']);return l};
    var prPages=function(p){var l=[];if(internal(p.url))l.push([pagePath(p.url),p.title,'바로 열기']);(p.links||[]).forEach(function(x){if(internal(x.url))l.push([pagePath(x.url),p.title+' · '+x.label,x.label])});return l};
    var rcPages=function(r){return recPages(r).map(function(u){var l=(r.links||[]).filter(function(x){return x.url===u})[0];return [pageKey(u),r.title+(l?' · '+l.label:''),l?l.label:(r.more&&/program\.html/.test(u)?'행사 내용 열기':'바로 열기')]})};
    VIEWN=0;
    $('#cl').innerHTML='<h3>행사</h3>'+head+ev.map(function(e){return row('data/events.js','id:"'+e.id+'"',e.title,e.start,e,evPages(e))}).join('')+'</tbody></table><h3>진행 사업</h3>'+head+pr.map(function(p){return row('data/projects.js','title:"'+p.title+'"',p.title,p.area,p,prPages(p))}).join('')+'</tbody></table><h3>기록</h3>'+head+rc.map(function(r){return row('data/events.js','rec:"'+r.rec+'"',r.title,r.group,r,rcPages(r))}).join('')+'</tbody></table>';
    wireView($('#cl'));
    $('#cl').querySelectorAll('[data-f]').forEach(function(b){b.onclick=function(){if(needGH())return;b.disabled=true;toast('저장하는 중…',60000);api({action:'cardSet',file:b.dataset.f,key:b.dataset.k,field:b.dataset.field,on:!!b.dataset.on}).then(function(){toast('저장했습니다. 1~2분 뒤 반영됩니다.',7000);setTimeout(vCards,2500)}).catch(function(e){toast(e.message,8000);b.disabled=false})}})
  }).catch(function(e){$('#cl').textContent='불러오지 못했습니다: '+e.message})}
/* 만족도 조사: 행사 목록에서 행사를 눌러 봅니다. 행사와 양식은 data/events.js 의 survey 값으로 잇습니다 */
var SURVEY_STATS={'birding2026-survey':{counts:[11,12]}};
function vSurveys(id){$('#view').innerHTML='<h2>만족도 조사</h2><p class="note">행사 이름을 누르면 그 행사의 응답을 봅니다.</p><div id="sl">불러오는 중…</div>';
  fetch('/data/events.js?t='+Date.now(),{cache:'no-store'}).then(function(r){return r.text()}).then(function(t){
    var ev=new Function(t+';return EVENTS')().sort(function(a,b){return a.start<b.start?1:-1});
    var pick=ev.filter(function(e){return e.id===id&&e.survey})[0];
    if(pick)return openSurvey(pick);
    if(id)location.hash='survey';
    $('#sl').innerHTML='<table><thead><tr><th>행사</th><th>주최</th><th>날짜</th><th>조사</th><th>응답</th></tr></thead><tbody>'+ev.map(function(e,i){
      return '<tr><td>'+(e.survey?'<button class="btn" data-ev="'+i+'">'+esc(e.title)+'</button>':esc(e.title))+(e.draft?' <span class="chip private">비공개</span>':'')+'</td><td>'+own(e)+'</td><td>'+esc(e.start)+'</td><td>'+(e.survey?'있음':'<span class="note">없음</span>')+'</td><td id="sc'+i+'">'+(e.survey?'확인 중':'-')+'</td></tr>'}).join('')+'</tbody></table>';
    ev.forEach(function(e,i){if(!e.survey)return;api({action:'list',form:e.survey}).then(function(j){var c=$('#sc'+i);if(c)c.textContent=j.rows.length+'건'}).catch(function(x){var c=$('#sc'+i);if(c)c.textContent=x.message})});
    $('#sl').querySelectorAll('[data-ev]').forEach(function(b){b.onclick=function(){openSurvey(ev[+b.dataset.ev])}})
  }).catch(function(e){$('#sl').textContent='불러오지 못했습니다: '+e.message})}
function openSurvey(e){location.hash='survey/'+e.id;vList(e.survey,e.title+' 만족도 조사',function(){location.hash='survey';vSurveys()},true,e)}
function surveyStats(form,h,r){if(!r.length)return '';var cfg=SURVEY_STATS[form]||{},nums=[];
  h.forEach(function(k,c){if(!c)return;var v=r.map(function(x){return x[c]}).filter(function(x){return String(x).trim()!==''});if(v.length&&v.every(function(x){return !isNaN(Number(x))}))nums.push(c)});
  var html=nums.length?'<div class="stats">'+nums.map(function(c){var s=0,n=0;r.forEach(function(x){if(String(x[c]).trim()!==''){s+=Number(x[c]);n++}});return '<div class="stat"><b>'+(s/n).toFixed(2)+'</b>'+esc(h[c])+'</div>'}).join('')+'</div>':'';
  var cnt=function(c){var m={};r.forEach(function(x){m[x[c]]=(m[x[c]]||0)+1});return esc(h[c])+': '+esc(Object.keys(m).map(function(k){return k+' '+m[k]}).join(' · '))};
  if(cfg.counts)html+='<p class="note">'+cfg.counts.map(cnt).join('<br>')+'</p>';return html}
/* 응답 */
function vList(form,title,back,isSurvey,ev){$('#view').innerHTML=(back?'<p><button class="btn" id="bk">← 행사 목록</button></p>':'')+'<h2>'+esc(title)+'</h2>'+(ev?'<p>주최 '+own(ev)+ownNote(ev)+'</p>':'')+'<div id="ls">불러오는 중…</div>';if(back)$('#bk').onclick=back;
  api({action:'list',form:form}).then(function(j){var h=j.heads,r=j.rows.slice().reverse(),html='<p><b>'+r.length+'건</b> <button class="btn" id="csv">엑셀용 CSV 내려받기</button> <button class="btn" id="re">새로고침</button>'+(status.sheet?' <a class="btn" style="display:inline-block;text-decoration:none" href="'+status.sheet+'" target="_blank">구글 시트 열기</a>':'')+(j.folder?' <a class="btn" style="display:inline-block;text-decoration:none" href="'+j.folder+'" target="_blank">드라이브 폴더 열기</a> <button class="btn" id="sd">드라이브에 빠진 응답 저장</button>':'')+'</p>';
    if(j.opens)html+='<p class="note">조사 오픈: '+esc(j.opens.replace('T',' ').replace(':00+09:00',''))+'</p>';
    if(isSurvey)html+=surveyStats(form,h,r);
    html+=r.length?'<table><thead><tr><th>내려받기</th>'+h.map(function(x){return '<th>'+esc(x)+'</th>'}).join('')+'</tr></thead><tbody>'+r.map(function(x,ri){return '<tr><td><button class="btn" data-dl="'+ri+'">받기</button></td>'+x.map(function(v){return '<td>'+esc(v)+'</td>'}).join('')+'</tr>'}).join('')+'</tbody></table>':'<p class="note">아직 들어온 내용이 없습니다.</p>';
    $('#ls').innerHTML=html;$('#re').onclick=function(){vList(form,title,back,isSurvey,ev)};
    if($('#sd'))$('#sd').onclick=function(){toast('저장하는 중…',60000);api({action:'syncDrive',form:form}).then(function(x){toast('새로 저장 '+x.made+'건, 전체 '+x.total+'건입니다.',7000)}).catch(function(e){toast(e.message,8000)})};
    var save=function(name,type,c){var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([c],{type:type}));a.download=name;a.click()};
    $('#ls').querySelectorAll('[data-dl]').forEach(function(b){b.onclick=function(){var x=r[+b.dataset.dl];save(form+'_'+String(x[0]).replace(/[^0-9]/g,'')+'.txt','text/plain;charset=utf-8','\ufeff'+h.map(function(k,i){return k+': '+x[i]}).join('\r\n')+'\r\n')}});
    $('#csv').onclick=function(){var q=function(v){return '"'+String(v).replace(/"/g,'""')+'"'};var c='﻿'+[h].concat(j.rows).map(function(x){return x.map(q).join(',')}).join('\r\n');var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([c],{type:'text/csv;charset=utf-8'}));a.download=form+'.csv';a.click()}
  }).catch(function(e){$('#ls').textContent=e.message})}
/* 설정 */
function vSettings(){$('#view').innerHTML='<h2>GitHub 연결</h2><p>상태: <b>'+(status.github?'연결됨':'연결 안 됨')+'</b></p><p class="note">페이지 공개·비밀번호와 카드 공개를 바꾸려면 필요합니다. 토큰은 서버에만 저장되고 화면에 다시 나오지 않습니다.</p><form id="gf"><label for="gt">GitHub 토큰</label><input id="gt" type="password" autocomplete="off"><p><button class="btn on">연결</button></p></form>'+
  '<h2 style="margin-top:26px">관리자 비밀번호 변경</h2><form id="pf"><label for="po">현재 비밀번호</label><input id="po" type="password" required autocomplete="current-password"><label for="pn">새 비밀번호 (8자 이상)</label><input id="pn" type="password" required autocomplete="new-password"><p><button class="btn on">변경</button></p></form>'+
  '<h2 style="margin-top:26px">저장 위치</h2><p><a href="'+(status.sheet||'#')+'" target="_blank">구글 시트 열기</a></p>';
  $('#gf').onsubmit=function(e){e.preventDefault();toast('확인하는 중…',30000);api({action:'ghSet',token:$('#gt').value}).then(function(j){status.github=j.github;toast('연결했습니다.');vSettings()}).catch(function(x){toast(x.message,9000)})};
  $('#pf').onsubmit=function(e){e.preventDefault();api({action:'changePw',old:$('#po').value,pw:$('#pn').value}).then(function(){toast('비밀번호를 바꿨습니다.');$('#po').value='';$('#pn').value=''}).catch(function(x){toast(x.message,8000)})}}
if(S)start();
})();
</script>
