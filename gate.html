<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>페이지 준비 중 | 제주 에코투어리즘</title>
<meta name="description" content="제주 에코투어리즘 페이지를 준비하고 있습니다.">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:"Noto Sans KR",system-ui,sans-serif;color:#2A2320;background:#1E3F27;word-break:keep-all}
.bg{position:fixed;inset:0;width:100%;height:100%;object-fit:cover}
.shade{position:fixed;inset:0;background:linear-gradient(180deg,rgba(20,35,24,.15),rgba(20,35,24,.6))}
main{position:relative;min-height:100%;display:grid;place-items:center;padding:24px 20px}
.panel{width:100%;max-width:400px;background:#F7F2E8;border-radius:16px;padding:32px 28px;box-shadow:0 18px 50px rgba(0,0,0,.28)}
.brand{font-size:.82rem;font-weight:700;color:#2F5E3A;letter-spacing:.02em}
h1{font-family:"Noto Serif KR",serif;font-size:1.75rem;line-height:1.35;color:#1E3F27;margin-top:8px}
.lead{margin-top:8px;color:#5E5248;font-size:.95rem;line-height:1.7}
label{display:block;margin-top:22px;font-size:.88rem;font-weight:700}
input{display:block;width:100%;min-height:48px;margin-top:6px;padding:10px 14px;font:inherit;font-size:16px;border:1px solid #CDBFA6;border-radius:10px;background:#fff;color:inherit}
input:focus-visible,button:focus-visible{outline:3px solid #C0492B;outline-offset:2px}
button{width:100%;min-height:48px;margin-top:12px;border:0;border-radius:10px;background:#2F5E3A;color:#fff;font:inherit;font-weight:700;cursor:pointer}
button:hover{background:#1E3F27}
.err{min-height:1.5em;margin-top:8px;color:#A83A20;font-size:.88rem;font-weight:500}
</style>
</head>
<body>
<img class="bg" src="assets/interview/14_sustain.jpg" alt="맑은 바다와 해안선을 내려다본 항공 사진" fetchpriority="high">
<div class="shade"></div>
<main>
  <form class="panel" id="f" autocomplete="off">
    <p class="brand">제주 에코투어리즘</p>
    <h1>페이지 준비 중</h1>
    <p class="lead">제주의 자연과 마을을 만나는 새로운 안내 페이지를 준비하고 있습니다.</p>
    <label for="pw">비밀번호</label>
    <input id="pw" type="password" inputmode="numeric" required autofocus>
    <p class="err" id="err" role="alert"></p>
    <button type="submit">들어가기</button>
  </form>
</main>
<script>
(function () {
  var KEY = 'jeco-preview-unlocked';
  var HASH = '00d9c25dcdd9f364bb3c6ab9830d5e336c52607e66b10c7eb1b092b1522bc06b';
  function sha(text) {
    return crypto.subtle.digest('SHA-256', new TextEncoder().encode(text)).then(function (b) {
      return Array.from(new Uint8Array(b)).map(function (x) { return x.toString(16).padStart(2, '0'); }).join('');
    });
  }
  function nextUrl() {
    var n = new URLSearchParams(location.search).get('next') || '';
    /* 같은 사이트 안의 주소로만 돌아갑니다 */
    if (n.charAt(0) !== '/' || n.charAt(1) === '/' || n.charAt(1) === '\\' || /gate\.html/.test(n)) return new URL('index.html', location.href).href;
    return n;
  }
  function keep() {
    try { localStorage.setItem(KEY, '1'); return; } catch (e) {}
    try { sessionStorage.setItem(KEY, '1'); } catch (e) {}
  }
  document.getElementById('f').addEventListener('submit', function (e) {
    e.preventDefault();
    var input = document.getElementById('pw');
    var err = document.getElementById('err');
    sha('jejuecotourism-preview:' + input.value).then(function (h) {
      if (h === HASH) { keep(); location.replace(nextUrl()); }
      else { err.textContent = '비밀번호가 맞지 않습니다.'; input.value = ''; input.focus(); }
    });
  });
})();
</script>
</body>
</html>
